# Model Configuration for AI Trip Planner

# OpenAI Configuration
openai:
  api_key: "${OPENAI_API_KEY}"
  model: "gpt-4-turbo-preview"
  temperature: 0.7
  max_tokens: 2000
  timeout: 30
  retry_attempts: 3

# Anthropic Configuration
anthropic:
  api_key: "${ANTHROPIC_API_KEY}"
  model: "claude-3-sonnet-20240229"
  temperature: 0.7
  max_tokens: 2000
  timeout: 30
  retry_attempts: 3

# Cohere Configuration
cohere:
  api_key: "${COHERE_API_KEY}"
  model: "command"
  temperature: 0.7
  max_tokens: 2000
  timeout: 30
  retry_attempts: 3

# Model Selection Strategy
model_selection:
  strategy: "round_robin"  # round_robin, load_based, capability_based
  fallback_models: ["openai", "anthropic", "cohere"]
  load_threshold: 0.8

# Agent Model Assignments
agent_models:
  planning_agent:
    primary: "openai"
    fallback: "anthropic"
    temperature: 0.7
    
  research_agent:
    primary: "openai"
    fallback: "anthropic"
    temperature: 0.3
    
  execution_agent:
    primary: "anthropic"
    fallback: "openai"
    temperature: 0.2
    
  monitoring_agent:
    primary: "openai"
    fallback: "anthropic"
    temperature: 0.1
    
  budget_agent:
    primary: "anthropic"
    fallback: "openai"
    temperature: 0.1
    
  booking_agent:
    primary: "openai"
    fallback: "anthropic"
    temperature: 0.2

# Performance Settings
performance:
  max_concurrent_requests: 10
  request_timeout: 30
  retry_delay: 1
  circuit_breaker:
    enabled: true
    failure_threshold: 5
    recovery_timeout: 60

# Caching
caching:
  enabled: true
  ttl: 3600  # 1 hour
  max_size: 1000
  strategy: "lru"

# Rate Limiting
rate_limiting:
  enabled: true
  requests_per_minute: 60
  burst_limit: 10
  window_size: 60
